<!DOCTYPE html>
<html lang="en" data-theme="modernist" data-appearance="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Sweep '26 — World Cup Sweepstake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>/* ── The Sweep '26 — retro theme tokens ──────────────────────────────────────
   3 directions × light/dark. Set via [data-theme] + [data-appearance] on <html>.
   --------------------------------------------------------------------------- */

:root{
  --font-display:'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --font-ui:'Archivo', system-ui, sans-serif;
  --font-mono:'Space Mono', ui-monospace, monospace;

  --r-card:4px;     /* poster look = crisp corners */
  --maxw:1180px;
  --halftone:rgba(0,0,0,.05);
}

/* ============================= PANINI (Mexico '70) ======================== */
[data-theme="panini"]{
  --accent:#d9482f; --accent-2:#1f8a7a; --accent-3:#e0a128; --accent-4:#21487a;
  --gold:#dc9a1f; --win:#2f8a4f; --out:#c0492f; --spoon:#8a5cc4;
  --accent-ink:#fbf4e3;
}
[data-theme="panini"][data-appearance="light"]{
  --paper:#f1e6c9; --paper-2:#e9dbb8; --surface:#fbf4e1; --surface-2:#f2e7c9;
  --ink:#2a2216; --ink-2:#6e6048; --ink-3:#a08e6c; --line:#d8c49a;
  --halftone:rgba(42,34,22,.06); --shadow:rgba(70,52,18,.16);
}
[data-theme="panini"][data-appearance="dark"]{
  --paper:#1a1610; --paper-2:#211b11; --surface:#262015; --surface-2:#2f2718;
  --ink:#f3e8cf; --ink-2:#bdab86; --ink-3:#8a7b5c; --line:#3e3420;
  --halftone:rgba(255,247,224,.05); --shadow:rgba(0,0,0,.5);
}

/* ============================ MODERNIST (España '82) ====================== */
[data-theme="modernist"]{
  --accent:#cf2e2e; --accent-2:#1c2b4a; --accent-3:#e6b422; --accent-4:#2b6f6a;
  --gold:#d9a40f; --win:#2f7d52; --out:#cf2e2e; --spoon:#7a5ad0;
  --accent-ink:#f7f3ec;
}
[data-theme="modernist"][data-appearance="light"]{
  --paper:#ece5d6; --paper-2:#e2dac8; --surface:#f7f3ea; --surface-2:#ebe3d3;
  --ink:#17171a; --ink-2:#56524a; --ink-3:#928d80; --line:#d2c8b7;
  --halftone:rgba(23,23,26,.05); --shadow:rgba(28,43,74,.16);
}
[data-theme="modernist"][data-appearance="dark"]{
  --paper:#13151b; --paper-2:#181b23; --surface:#1d212b; --surface-2:#252a39;
  --ink:#f0ece2; --ink-2:#aaa599; --ink-3:#757269; --line:#2f3441;
  --halftone:rgba(240,236,226,.05); --shadow:rgba(0,0,0,.55);
}

/* ============================== NIGHT (floodlit print) ==================== */
[data-theme="night"]{
  --accent:#e8633f; --accent-2:#29a59a; --accent-3:#f0b83a; --accent-4:#5aa9d6;
  --gold:#f0b83a; --win:#2bb673; --out:#e8633f; --spoon:#b07ce0;
  --accent-ink:#0f1c1f;
}
[data-theme="night"][data-appearance="dark"]{
  --paper:#0e1b1e; --paper-2:#112226; --surface:#15292d; --surface-2:#1c3338;
  --ink:#ece3cf; --ink-2:#9fb0ac; --ink-3:#6c7f7b; --line:#234043;
  --halftone:rgba(236,227,207,.055); --shadow:rgba(0,0,0,.55);
}
[data-theme="night"][data-appearance="light"]{
  --paper:#e4ebe9; --paper-2:#dae2df; --surface:#f1f5f3; --surface-2:#e3ebe8;
  --ink:#0f2024; --ink-2:#4c5d5b; --ink-3:#7f908d; --line:#c4d2cf;
  --halftone:rgba(15,32,36,.05); --shadow:rgba(20,50,52,.16);
}

/* ===================== HOSTS (USA · CANADA · MEXICO) ====================== */
/* Red is shared by all three flags → the anchor. USA blue + Mexico green
   as supporting accents, on warm white paper. */
[data-theme="hosts"]{
  --accent:#cf3338; --accent-2:#1f7a4d; --accent-3:#2f54a6; --accent-4:#4a86c5;
  --gold:#d99a1f; --win:#1f7a4d; --out:#cf3338; --spoon:#7a5ad0;
  --accent-ink:#f9f5ec;
}
[data-theme="hosts"][data-appearance="light"]{
  --paper:#f1ece0; --paper-2:#e8e1d1; --surface:#f9f5ea; --surface-2:#ece4d3;
  --ink:#1b1f2a; --ink-2:#565c68; --ink-3:#8f949c; --line:#d4cbb8;
  --halftone:rgba(27,31,42,.05); --shadow:rgba(47,84,166,.16);
}
[data-theme="hosts"][data-appearance="dark"]{
  --paper:#0f131b; --paper-2:#141a24; --surface:#18202c; --surface-2:#202938;
  --ink:#f0ece1; --ink-2:#a6abb5; --ink-3:#70757f; --line:#2b3441;
  --halftone:rgba(240,236,225,.05); --shadow:rgba(0,0,0,.55);
}

/* ── base ─────────────────────────────────────────────────────────────────*/
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);}
body{
  font-family:var(--font-ui);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background .35s ease, color .35s ease;
}
/* halftone dot texture layer behind everything */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(var(--halftone) 1px, transparent 1.4px);
  background-size:7px 7px;
  mix-blend-mode:normal;opacity:var(--ht-opacity,.9);
  transition:opacity .3s ease;
}
.app{position:relative;z-index:1;}

::selection{background:var(--accent);color:var(--accent-ink);}

/* utility */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;}
.mono{font-family:var(--font-mono);}
.disp{font-family:var(--font-display);font-weight:800;line-height:.92;}
/* ── app.css — components for The Sweep '26 ──────────────────────────────── */

/* ============================ MASTHEAD ==================================== */
.mast{ position:relative; background:var(--surface);
  border-bottom:2px solid var(--ink); padding-top:env(safe-area-inset-top,0px); }
.mast-in{ display:flex; align-items:flex-end; justify-content:space-between;
  gap:24px; padding:48px 28px 22px; }
.mast-kicker{ font-size:11px; letter-spacing:.18em; color:var(--accent);
  text-transform:uppercase; }
.mast-title{ font-size:clamp(40px,7vw,80px); letter-spacing:-.01em;
  text-transform:uppercase; color:var(--ink); margin:4px 0 6px;
  white-space:nowrap; line-height:1; }
.mast-title::after{ content:" '26"; color:var(--accent); }
.mast-sub{ font-size:12px; letter-spacing:.16em; color:var(--ink-2);
  text-transform:uppercase; }
.mast-right{ padding-bottom:6px; }
.appbtn{ display:inline-flex; align-items:center; gap:8px; cursor:pointer;
  font-family:var(--font-mono); font-size:12px; letter-spacing:.12em;
  padding:9px 16px; border:1.5px solid var(--ink); background:transparent;
  color:var(--ink); border-radius:999px; transition:all .18s; }
.appbtn:hover{ background:var(--ink); color:var(--paper); }
.appbtn-dot{ width:10px; height:10px; border-radius:50%; background:var(--accent-3);
  box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent-3); }
.mast-stripe{ display:flex; height:8px; }
.mast-stripe i{ flex:1; }

/* ============================ HERO (pot + story) ========================== */
.hero{ display:grid; grid-template-columns:300px 1fr; gap:22px;
  align-items:stretch; padding-top:30px; padding-bottom:6px; }
.pot{ background:var(--ink); color:var(--paper); border-radius:var(--r-card);
  padding:22px 24px; display:flex; flex-direction:column; justify-content:center;
  position:relative; overflow:hidden; }
.pot::after{ content:''; position:absolute; right:-30px; top:-30px; width:130px;
  height:130px; border:14px solid var(--accent); border-radius:50%; opacity:.25; }
.pot-label{ font-size:12px; letter-spacing:.2em; opacity:.7; }
.pot-val{ font-size:clamp(58px,7vw,82px); color:var(--accent-3); margin:2px 0 6px;
  letter-spacing:-.02em; }
.pot-foot{ font-size:11px; letter-spacing:.1em; opacity:.65; }
.story{ background:var(--surface); border:1.5px solid var(--line);
  border-left:6px solid var(--accent); border-radius:var(--r-card);
  padding:20px 24px; display:flex; flex-direction:column; gap:11px; align-items:flex-start; }
.story-tag{ flex:none; font-size:11px; letter-spacing:.14em; color:var(--accent-ink);
  background:var(--accent); padding:5px 10px; border-radius:3px; }
.story-txt{ font-size:clamp(16px,1.7vw,20px); line-height:1.5; color:var(--ink);
  text-wrap:pretty; }
.story-txt strong{ color:var(--accent); font-weight:700; }

/* ============================ SECTION HEADS =============================== */
.shead{ display:flex; align-items:baseline; gap:14px; margin:38px 0 16px;
  border-bottom:2px solid var(--ink); padding-bottom:10px; }
.shead-n{ font-size:30px; color:var(--accent); letter-spacing:-.02em; }
.shead-txt{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.shead-title{ font-size:clamp(26px,3.6vw,40px); text-transform:uppercase;
  letter-spacing:-.01em; }
.shead-sub{ font-size:12px; letter-spacing:.1em; color:var(--ink-3);
  text-transform:uppercase; }

/* ============================ PRIZE BOARD ================================= */
.pboard{ display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:14px; }
.pcard{ position:relative; text-align:left; cursor:pointer; font-family:inherit;
  background:var(--surface); border:1.5px solid var(--line);
  border-radius:var(--r-card); padding:18px 18px 16px; overflow:hidden;
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s; }
.pcard:hover{ transform:translateY(-3px); border-color:var(--ink);
  box-shadow:6px 6px 0 var(--ink); }
.pcard:active{ transform:translateY(-1px); box-shadow:3px 3px 0 var(--ink); }
.pcard--winner{ grid-row:span 2; background:var(--ink); color:var(--paper);
  border-color:var(--ink); }
.pcard--winner .pcard-name,.pcard--winner .pcard-note{ color:var(--paper); opacity:.7; }
.pcard--winner .pcard-leader{ color:var(--paper); }
.pcard--winner .pcard-amt{ color:var(--accent-3); }
.pcard--winner:hover{ box-shadow:6px 6px 0 var(--accent); }
.pcard-top{ display:flex; align-items:center; justify-content:space-between; }
.pcard-medal{ display:inline-flex; align-items:center; justify-content:center;
  min-width:34px; height:34px; padding:0 8px; font-size:17px; letter-spacing:0;
  background:var(--accent); color:var(--accent-ink); border-radius:3px; }
.pcard--winner .pcard-medal{ background:var(--accent-3); color:#1b1b1b; }
.pcard-amt{ font-size:clamp(20px,2.3vw,28px); letter-spacing:-.01em; color:var(--accent);
  margin-top:14px; }
.pcard--winner .pcard-amt{ font-size:clamp(30px,3.4vw,46px); color:var(--accent-3); }
.pcard-name{ font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-2); }
.pcard-leader{ font-size:clamp(26px,3vw,40px); font-weight:800; margin-top:6px;
  color:var(--ink); line-height:.96; letter-spacing:-.01em; text-wrap:balance; }
.pcard--winner .pcard-leader{ font-size:clamp(40px,5vw,66px); }
.pcard-team{ display:flex; align-items:center; gap:7px; font-size:15px;
  color:var(--ink-2); margin-top:3px; }
.pcard--winner .pcard-team{ color:var(--paper); opacity:.85; font-size:18px; }
.pcard-flag{ font-size:19px; }
.pcard-foot{ margin-top:14px; display:flex; flex-direction:column; gap:6px; }
.pcard-pill{ align-self:flex-start; font-size:10px; letter-spacing:.1em;
  padding:4px 9px; border-radius:3px; border:1.5px solid var(--line);
  color:var(--ink-2); }
.pcard-pill--won{ background:var(--win); border-color:var(--win); color:#fff; }
.pcard--winner .pcard-pill{ border-color:color-mix(in srgb,var(--paper) 32%,transparent);
  color:var(--paper); opacity:.85; }
.pcard-note{ font-size:12.5px; color:var(--ink-3); line-height:1.35; }
.pcard.is-won{ border-color:var(--win); }
.pcard.is-won::before{ content:''; position:absolute; top:0; left:0; bottom:0;
  width:5px; background:var(--win); }

/* ============================ STAGE TRACKER =============================== */
.track{ display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
.tstep{ position:relative; padding-top:6px; }
.tstep-bar{ height:9px; background:var(--surface-2); border:1.5px solid var(--line);
  border-radius:3px; overflow:hidden; }
.tstep-bar i{ display:block; height:100%; width:0; background:var(--ink);
  transition:width .7s cubic-bezier(.4,0,.1,1); transition-delay:var(--d); }
.tstep--done .tstep-bar i{ background:var(--win); }
.tstep--current .tstep-bar i{ background:var(--accent-3);
  background-image:repeating-linear-gradient(45deg, rgba(0,0,0,.18) 0 6px, transparent 6px 12px); }
.track--in .tstep--done .tstep-bar i,
.track--in .tstep--current .tstep-bar i{ width:100%; }
.track--in .tstep--todo .tstep-bar i{ width:0; }
.tstep-count{ font-size:clamp(30px,4vw,46px); margin-top:10px; color:var(--ink);
  letter-spacing:-.02em; }
.tstep--todo .tstep-count{ color:var(--ink-3); }
.tstep--current .tstep-count{ color:var(--accent); }
.tstep-label{ font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-2); margin-top:2px; }
.tstep-now{ display:inline-block; margin-top:8px; font-size:9.5px; letter-spacing:.12em;
  background:var(--accent); color:var(--accent-ink); padding:3px 7px; border-radius:3px; }

/* ============================ FILTERS ===================================== */
.filters{ display:flex; align-items:center; justify-content:space-between;
  gap:16px; margin-bottom:14px; flex-wrap:wrap; }
.ftabs{ display:flex; gap:8px; flex-wrap:wrap; }
.ftab{ display:inline-flex; align-items:center; gap:8px; cursor:pointer;
  font-family:var(--font-ui); font-size:13px; font-weight:600;
  padding:8px 14px; border:1.5px solid var(--line); background:var(--surface);
  color:var(--ink-2); border-radius:999px; transition:all .15s; }
.ftab:hover{ border-color:var(--ink); color:var(--ink); }
.ftab.is-on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.ftab-n{ font-size:11px; opacity:.85; }
.ftab.is-on .ftab-n{ opacity:1; }
.fsearch{ position:relative; flex:none; }
.fsearch-in{ font-family:var(--font-mono); font-size:13px; width:240px; max-width:48vw;
  padding:9px 30px 9px 14px; border:1.5px solid var(--line); background:var(--surface);
  color:var(--ink); border-radius:999px; outline:none; transition:border-color .15s; }
.fsearch-in::placeholder{ color:var(--ink-3); }
.fsearch-in:focus{ border-color:var(--ink); }
.fsearch-x{ position:absolute; right:6px; top:50%; transform:translateY(-50%);
  border:0; background:transparent; color:var(--ink-3); cursor:pointer;
  width:22px; height:22px; border-radius:50%; font-size:12px; }
.fsearch-x:hover{ color:var(--ink); }

/* ============================ TABLE ======================================= */
.tablewrap{ border:1.5px solid var(--line); border-radius:var(--r-card);
  overflow:hidden; }
.ptable{ width:100%; border-collapse:collapse; }
.ptable thead th{ font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-2); text-align:left; cursor:pointer;
  padding:12px 16px; background:var(--surface-2); border-bottom:2px solid var(--ink);
  user-select:none; white-space:nowrap; }
.ptable thead th:hover{ color:var(--ink); }
.ptable thead th.is-sorted{ color:var(--accent); }
.th-arrow{ font-size:9px; margin-left:4px; }
.col-id{ width:46px; } .col-goals{ width:80px; } .col-status{ width:150px; }
.prow{ cursor:pointer; border-bottom:1px solid var(--line);
  transition:background .12s; }
.prow:last-child{ border-bottom:0; }
.prow:hover{ background:var(--surface); }
.prow:nth-child(even){ background:color-mix(in srgb, var(--surface) 45%, transparent); }
.prow:nth-child(even):hover{ background:var(--surface); }
.prow td{ padding:11px 16px; vertical-align:middle; font-size:14px; color:var(--ink); }
.col-id{ color:var(--ink-3); }
.col-name{ font-weight:600; }
.ttag{ display:inline-flex; align-items:center; gap:8px; font-size:14px;
  padding:4px 12px 4px 6px; border:1.5px solid var(--line); border-radius:999px;
  background:var(--surface); }
.ttag--active{ border-color:color-mix(in srgb,var(--win) 50%,var(--line)); }
.ttag--eliminated{ opacity:.6; text-decoration:line-through;
  text-decoration-color:var(--out); text-decoration-thickness:1.5px; }
.ttag--spoon{ border-color:var(--spoon); color:var(--spoon); }
.tflag{ font-size:17px; }
.gbadge{ display:inline-flex; align-items:center; justify-content:center;
  min-width:30px; padding:3px 8px; font-size:13px; background:var(--surface-2);
  border:1.5px solid var(--line); border-radius:3px; color:var(--ink-2); }
.gbadge.is-top{ background:var(--accent-3); border-color:var(--accent-3);
  color:var(--ink); font-weight:700; }
.sbadge{ display:inline-flex; align-items:center; gap:7px; font-size:13px;
  color:var(--ink-2); white-space:nowrap; }
.sdot{ width:9px; height:9px; border-radius:50%; flex:none; }
.st-active .sdot{ background:var(--win); box-shadow:0 0 0 3px color-mix(in srgb,var(--win) 22%,transparent); }
.st-out .sdot{ background:var(--out); }
.st-spoon .sdot{ background:var(--spoon); }
.st-active{ color:var(--win); }
.st-spoon{ color:var(--spoon); }
.ptag{ display:inline-block; font-size:11px; font-family:var(--font-mono);
  letter-spacing:.04em; padding:4px 9px; border-radius:3px; border:1.5px solid var(--line);
  color:var(--ink-2); }
.ptag.is-won{ background:var(--win); border-color:var(--win); color:#fff; }
.ptag--winner{ border-color:var(--gold); color:var(--gold); }
.ptag--runner,.ptag--boot{ border-color:var(--accent); color:var(--accent); }
.ptag--spoon{ background:var(--spoon); border-color:var(--spoon); color:#fff; }
.ptag-none{ color:var(--ink-3); }
.empty{ text-align:center; padding:40px; color:var(--ink-3); letter-spacing:.1em; }

/* ============================ DETAIL DRAWER =============================== */
.drawer-scrim{ position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.45);
  opacity:0; pointer-events:none; transition:opacity .28s ease; }
.drawer-scrim.is-open{ opacity:1; pointer-events:auto; }
.drawer{ position:absolute; top:0; right:0; height:100%; width:min(440px,92vw);
  background:var(--paper); border-left:2px solid var(--ink); overflow-y:auto;
  transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.1,1);
  padding:26px 28px 40px; }
.drawer.is-open{ transform:translateX(0); }
.drawer-x{ position:absolute; top:18px; right:18px; width:34px; height:34px;
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:50%; cursor:pointer; font-size:14px; transition:all .15s; }
.drawer-x:hover{ background:var(--ink); color:var(--paper); }
.drawer-num{ font-size:11px; letter-spacing:.14em; color:var(--accent); }
.drawer-name{ font-size:34px; text-transform:uppercase; margin:6px 0 12px;
  letter-spacing:-.01em; }
.drawer-team{ display:flex; align-items:center; gap:12px; padding:14px 0;
  border-top:1.5px solid var(--line); border-bottom:1.5px solid var(--line);
  margin-bottom:16px; }
.drawer-flag{ font-size:38px; }
.drawer-teamname{ font-size:30px; text-transform:uppercase; }
.drawer .sbadge{ margin-top:14px; }
.drawer-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background:var(--line); border:1.5px solid var(--line); border-radius:var(--r-card);
  overflow:hidden; margin:16px 0; }
.dstat{ background:var(--surface); padding:14px 10px; text-align:center; }
.dstat-n{ display:block; font-size:30px; color:var(--ink); letter-spacing:-.02em; }
.dstat-l{ font-size:9.5px; letter-spacing:.08em; color:var(--ink-3); margin-top:3px; }
.drawer-prize{ display:flex; flex-direction:column; gap:3px; padding:14px 16px;
  border:1.5px solid var(--accent); border-radius:var(--r-card); margin-bottom:18px; }
.drawer-prize span{ font-size:10px; letter-spacing:.14em; color:var(--accent); }
.drawer-prize strong{ font-size:18px; color:var(--ink); }
.drawer-prize.ptag--spoon{ border-color:var(--spoon); }
.drawer-prize.ptag--spoon span{ color:var(--spoon); }
.drun-head{ font-size:11px; letter-spacing:.14em; color:var(--ink-3);
  text-transform:uppercase; margin-bottom:6px; }
.drun-step{ display:flex; gap:14px; padding:10px 0; position:relative; }

  <script>// ── confetti.js — tiny canvas confetti, retro paper colors ───────────────────
// window.fireConfetti({ x, y, count }) — origin in viewport px (defaults center-top).
(function () {
  let canvas, ctx, raf = null, pieces = [];

  function ensure() {
    if (canvas) return;
    canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2147483000;';
    document.body.appendChild(canvas);
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
  }
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function colors() {
    const cs = getComputedStyle(document.documentElement);
    return ['--accent', '--accent-2', '--accent-3', '--accent-4', '--gold']
      .map(v => cs.getPropertyValue(v).trim())
      .filter(Boolean);
  }
  function fire(opts) {
    opts = opts || {};
    ensure();
    const cols = colors();
    const cx = opts.x != null ? opts.x : innerWidth / 2;
    const cy = opts.y != null ? opts.y : innerHeight * 0.28;
    const count = opts.count || 90;
    for (let i = 0; i < count; i++) {
      const ang = (-Math.PI / 2) + (Math.random() - 0.5) * 2.0;
      const spd = 7 + Math.random() * 11;
      pieces.push({
        x: cx + (Math.random() - 0.5) * 40,
        y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 3,
        g: 0.26 + Math.random() * 0.12,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        w: 6 + Math.random() * 7,
        h: 8 + Math.random() * 9,
        col: cols[(Math.random() * cols.length) | 0] || '#d9482f',
        life: 0,
        ttl: 120 + Math.random() * 60,
        shape: Math.random() < 0.35 ? 'circle' : 'rect',
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of pieces) {
      p.life++;
      p.vy += p.g;
      p.vx *= 0.99;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      const fade = Math.max(0, 1 - p.life / p.ttl);
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
    }
    pieces = pieces.filter(p => p.life < p.ttl && p.y < innerHeight + 40);
    if (pieces.length) {
      raf = requestAnimationFrame(tick);
    } else {
      raf = null;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
    }
  }
  window.fireConfetti = fire;
})();

    'United States':              'United States',
    'USA':                        'United States',
    'Bosnia and Herzegovina':     'Bosnia & Herzegovina',
    'Bosnia-Herzegovina':         'Bosnia & Herzegovina',
    "Côte d'Ivoire":              'Ivory Coast',
    'Ivory Coast':                'Ivory Coast',
    'Republic of Korea':          'South Korea',
    'Korea Republic':             'South Korea',
    'DR Congo':                   'DR Congo',
    'Congo DR':                   'DR Congo',
    'IR Iran':                    'Iran',
    'Curaçao':                    'Curaçao',
    'Curacao':                    'Curaçao',
    'Czechia':                    'Czechia',
    'Czech Republic':             'Czechia',
    'Saudi Arabia':               'Saudi Arabia',
    'Cape Verde':                 'Cape Verde',
    'New Zealand':                'New Zealand',
    'South Africa':               'South Africa',
    'Costa Rica':                 'Costa Rica',
  };

  function normaliseName(name) {
    return NAME_MAP[name] || name;

  // Determine if a team is still active, eliminated, or wooden spoon
  // We track who's out based on standing data once group stage is done
  function computeStatus(standing, stage) {
    if (stage === 'GROUP_STAGE' || stage === 'group') return 'active';
    // After group stage: position 1 & 2 advance, plus best 8 third-placed
    // For simplicity, mark as eliminated once the tournament is past group stage
    // and they have no knockout matches — the API /matches endpoint handles this better
    return standing.qualified ? 'active' : 'eliminated';

      if (group.type !== 'TOTAL') return;
      const groupLetter = group.group ? group.group.replace('GROUP_', '') : '?';
      group.table.forEach(row => {
        const name = normaliseName(row.team.name);
        const isEliminated = !row.qualified && standingsData.season?.currentMatchday >= 3;
        const isThrough = row.qualified === true;
        teamStats[name] = {
          goals:    row.goalsFor,
          status:   isThrough ? 'through' : (isEliminated ? 'eliminated' : 'active'),
          group:    groupLetter,
          finish:   '—',  // only set when advancing to a knockout round
          position: row.position,

          worstTeam = name;

    const topScorer   = (scorersData.scorers || [])[0];
    const bootTeam    = topScorer ? normaliseName(topScorer.team.name) : null;
    const bootGoals   = topScorer ? topScorer.goals : 0;
    const bootPlayer  = topScorer ? topScorer.player.name : null;

    // Most group stage goals
    let mostGoalsTeam = null, mostGoals = -1;
    Object.entries(teamStats).forEach(([name, s]) => {
      if (s.goals > mostGoals) { mostGoals = s.goals; mostGoalsTeam = name; }
    });

    // Build participants from the static draw
    const staticParticipants = window.SWEEP.participants;
    return staticParticipants.map(p => {

        ...p,
        goals:    stats.goals    ?? 0,

    const md = matchday || 0;

      { key:'group', label:'Group Stage',    count:48, state: md < 3 ? 'current' : 'done' },
      { key:'r32',   label:'Round of 32',    count:32, state: md < 3 ? 'todo' : md === 3 ? 'current' : 'done' },
      { key:'r16',   label:'Round of 16',    count:16, state: md < 4 ? 'todo' : md === 4 ? 'current' : 'done' },
      { key:'qf',    label:'Quarter-Finals', count:8,  state: md < 5 ? 'todo' : md === 5 ? 'current' : 'done' },
      { key:'sf',    label:'Semi-Finals',    count:4,  state: md < 6 ? 'todo' : md === 6 ? 'current' : 'done' },
      { key:'champ', label:'Champions',      count:1,  state: md < 7 ? 'todo' : 'done' },

  // Build prize leaders from participants
  function buildPrizes(participants, scorersData) {
    const topScorer   = (scorersData.scorers || [])[0];
    const bootPlayer  = topScorer ? topScorer.player.name : null;
    const bootTeamName = topScorer ? normaliseName(topScorer.team.name) : null;

    const findLeader = (key) => participants.find(p => p.prizeKey === key);
    const bootHolder  = participants.find(p => p.team === bootTeamName);
    const goalsHolder = findLeader('goals');
    const spoonHolder = findLeader('spoon');

    const maxGoals = Math.max(...participants.map(p => p.goals || 0));
    const topGoalsP = participants.find(p => p.goals === maxGoals);

    return [
      { key:'winner', medal:'1', label:'Tournament Winner',  amount:96,  share:'40%',
        rule:'Your team lifts the trophy.',
        leader:'TBD', team:'—', flag:'⏳', note:'Still to be decided', won:false },
      { key:'runner', medal:'2', label:'Runner-Up',           amount:60,  share:'25%',
        rule:'Your team reaches the final but falls short.',
        leader:'TBD', team:'—', flag:'⏳', note:'Still to be decided', won:false },
      { key:'boot',   medal:'B', label:'Golden Boot',         amount:48,  share:'20%',
        rule:"Your team has the tournament's top scorer.",
        leader: bootHolder ? bootHolder.name : 'TBD',
        team:   bootTeamName || '—',
        flag:   bootHolder ? bootHolder.flag : '⏳',
        note:   bootPlayer ? `${bootPlayer} leads with ${topScorer.goals} goals` : 'Still to be decided',
        won:    false },
      { key:'goals',  medal:'G', label:'Most Group Goals',    amount:24,  share:'10%',
        rule:'Your team scores the most across the group stage.',
        leader: goalsHolder ? goalsHolder.name : (topGoalsP ? topGoalsP.name : 'TBD'),
        team:   goalsHolder ? goalsHolder.team : (topGoalsP ? topGoalsP.team : '—'),
        flag:   goalsHolder ? goalsHolder.flag : (topGoalsP ? topGoalsP.flag : '⏳'),
        note:   topGoalsP ? `${topGoalsP.team} leads with ${maxGoals} goals` : 'Still to be decided',
        won:    !!goalsHolder },
      { key:'spoon',  medal:'S', label:'Wooden Spoon',        amount:12,  share:'5%',
        rule:'First team eliminated. Hard luck.',
        leader: spoonHolder ? spoonHolder.name : 'TBD',
        team:   spoonHolder ? spoonHolder.team : '—',
        flag:   spoonHolder ? spoonHolder.flag : '⏳',
        note:   spoonHolder ? `${spoonHolder.team} — out in groups` : 'Still to be decided',
        won:    !!spoonHolder },
    ];
  }

  // Main fetch — call this to get a live SWEEP object
  async function fetchSweep() {
    const [standingsData, scorersData] = await Promise.all([
      fetchJSON(`${BASE}/competitions/${COMP}/standings?season=2026`),
      fetchJSON(`${BASE}/competitions/${COMP}/scorers?limit=10&season=2026`),
    ]);

    const matchday   = standingsData.season?.currentMatchday ?? 0;
    const participants = buildParticipants(standingsData, scorersData);
    const prizes       = buildPrizes(participants, scorersData);
    const stages       = buildStages(matchday);

    return {
      POT:          window.SWEEP.POT,
      KICKOFF:      window.SWEEP.KICKOFF,
      PRIZES:       prizes,
      STAGES:       stages,
      participants,
    };
  }

  return { fetchSweep };
})();

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange, multiline }) {
  return (
    <TweakRow label={label}>
      {multiline
        ? <textarea className="twk-field twk-field--area" rows="4" value={value}
                    placeholder={placeholder} onChange={(e) => onChange(e.target.value)} />
        : <input className="twk-field" type="text" value={value} placeholder={placeholder}
                 onChange={(e) => onChange(e.target.value)} />}
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
</script>

// Shared to window for the app script. Styles live in sweep/app.css.

const RANK_GLYPH = { winner: 'I', runner: 'II', boot: 'GB', goals: 'MG', spoon: 'WS' };

function StoryTicker({ participants, prizes }) {
  const [idx, setIdx]       = React.useState(0);
  const [visible, setVisible] = React.useState(true);

  const stories = React.useMemo(() => {
    const out = [];
    const boot  = (prizes || []).find(p => p.key === 'boot');
    const goals = (prizes || []).find(p => p.key === 'goals');
    const spoon = (prizes || []).find(p => p.key === 'spoon');
    const ps    = participants || [];

    // Golden Boot
    if (boot && boot.leader && boot.leader !== 'TBD') {
      const hasNote = boot.note && !boot.note.includes('June');
      if (hasNote) {
        out.push(<React.Fragment><strong>{boot.note}</strong> — and {boot.leader} holds the Golden Boot. That £48 is looking very real.</React.Fragment>);
      }
      out.push(<React.Fragment><strong>{boot.leader}'s {boot.team}</strong> are in the Golden Boot race. Nobody else should get comfortable.</React.Fragment>);
    }

    // Most group goals
    if (goals && goals.leader && goals.leader !== 'TBD') {
      const maxG = Math.max(...ps.map(p => p.goals || 0));
      if (maxG > 0) {
        out.push(<React.Fragment><strong>{goals.leader}'s {goals.team}</strong> have {maxG} group goals. {goals.leader} is quietly confident. Everyone else should be worried.</React.Fragment>);
        out.push(<React.Fragment>Nobody panic but <strong>{goals.leader}'s {goals.team}</strong> have scored {maxG} group goals. They might actually do this.</React.Fragment>);
      }
    }

    // Wooden spoon
    if (spoon) {
      if (spoon.won && spoon.leader && spoon.leader !== 'TBD') {
        out.push(<React.Fragment>The £12 Wooden Spoon is confirmed. <strong>{spoon.leader}'s {spoon.team}</strong> are out and bottom of the pile. 🥄</React.Fragment>);
      } else if (spoon.leader && spoon.leader !== 'TBD') {
        out.push(<React.Fragment><strong>{spoon.leader}'s {spoon.team}</strong> are bottom of the pile right now. The Wooden Spoon is circling. 🥄</React.Fragment>);
      } else {
        out.push(<React.Fragment>The £12 <strong>Wooden Spoon</strong> is still up for grabs. Someone's going home with it — we just don't know who yet. 🥄</React.Fragment>);
      }
    }

    // Teams yet to score
    const blanks = ps.filter(p => (p.goals || 0) === 0 && p.status === 'active');
    if (blanks.length > 0 && blanks.length <= 8) {
      const z = blanks[0];
      out.push(<React.Fragment><strong>{z.name}'s {z.team}</strong> are yet to score. It is not looking great.</React.Fragment>);
    }

    // Eliminated
    const out_teams = ps.filter(p => p.status === 'eliminated' || p.status === 'spoon');
    if (out_teams.length > 0) {
      const e = out_teams[0];
      out.push(<React.Fragment><strong>{e.team}</strong> are out. {e.name} is not having a good time.</React.Fragment>);
    }

    if (out.length === 0) {
      out.push(<React.Fragment>The group stage is underway. <strong>£240 on the line.</strong> Anything could happen.</React.Fragment>);
    }

    return out;
  }, [participants, prizes]);

  React.useEffect(() => {
    if (stories.length <= 1) return;
    const id = setInterval(() => {
      setVisible(false);
      setTimeout(() => { setIdx(i => (i + 1) % stories.length); setVisible(true); }, 400);
    }, 7000);
    return () => clearInterval(id);
  }, [stories.length]);

  return (
    <div className="story">
      <span className="story-tag mono">LATEST</span>
      <p className="story-txt" style={{ opacity: visible ? 1 : 0, transition: 'opacity 0.4s ease' }}>
        {stories[idx]}
      </p>
    </div>
  );
}

function PrizeBoard({ prizes, onCelebrate }) {

      <div className="pboard">

function SectionHead({ n, title, sub }) {

  <script type="text/babel">// ── components-pre.jsx — pre-kickoff state (countdown, draw, prize rules) ─────

function Countdown({ to }) {
  const target = React.useMemo(() => new Date(to).getTime(), [to]);
  const [now, setNow] = React.useState(() => Date.now());
  React.useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);
  let diff = Math.max(0, target - now);
  const d = Math.floor(diff / 86400000); diff -= d * 86400000;
  const h = Math.floor(diff / 3600000); diff -= h * 3600000;
  const m = Math.floor(diff / 60000); diff -= m * 60000;
  const s = Math.floor(diff / 1000);
  const cells = [[d, 'DAYS'], [h, 'HRS'], [m, 'MIN'], [s, 'SEC']];
  return (
    <div className="cd">
      {cells.map(([n, l], i) => (
        <React.Fragment key={l}>
          {i > 0 && <span className="cd-sep disp">:</span>}
          <div className="cd-cell">
            <span className="cd-n disp">{String(n).padStart(2, '0')}</span>
            <span className="cd-l mono">{l}</span>
          </div>
        </React.Fragment>
      ))}
    </div>
  );
}

function PrizeRuleCard({ prize }) {

      <div className="pcard-name mono">{prize.label}</div>
      <div className="prule-amt disp">£{prize.amount}</div>
      <div className="prule-rule">{prize.rule}</div>
      <div className="pcard-foot">
        <span className="pcard-pill mono">{prize.share} OF POT</span>
      </div>
    </div>
  );
}

function PrizeRules({ prizes }) {
  return (
    <section className="wrap board-sec">
      <SectionHead n="02" title="What's up for grabs" sub="£240 pot · 5 ways to win" />
      <div className="pboard">
        {prizes.map(p => <PrizeRuleCard key={p.key} prize={p} />)}
      </div>
    </section>
  );
}

function GroupsSection({ participants, phase }) {
  const byGroup = React.useMemo(() => {
    const map = {};
    participants.forEach(p => {
      if (!map[p.group]) map[p.group] = [];
      map[p.group].push(p);
    });
    return map;
  }, [participants]);

  const groups = Object.keys(byGroup).sort();
  const isLive = phase === 'live';

  function rowState(p) {
    if (!isLive) return 'pending';
    if (p.status === 'eliminated' || p.status === 'spoon') return 'out';
    if (p.status === 'through') return 'through';
    return 'active';
  }

  function groupStatus(teams) {
    if (!isLive) return null;
    const states = teams.map(rowState);
    if (states.every(s => s === 'through' || s === 'out')) return 'COMPLETE';
    if (states.some(s => s === 'out' || s === 'through' || s === 'active')) return 'IN PROGRESS';
    return null;
  }

  const DOT = {
    pending: <span className="gdot gdot-pending" />,
    active:  <span className="gdot gdot-active" />,
    through: <span className="gdot gdot-through" />,
    out:     <span className="gdot gdot-out" />,
  };

  return (
    <section className="wrap groups-sec">
      <SectionHead n="01" title="The Groups" sub="12 groups · 4 teams each · top 2 advance" />
      {isLive && (
        <div className="glegend">
          <div className="glegend-item">{DOT.through}<span>THROUGH</span></div>
          <div className="glegend-item">{DOT.active}<span>STILL PLAYING</span></div>
          <div className="glegend-item">{DOT.out}<span>ELIMINATED</span></div>
        </div>
      )}
      <div className="groups-grid">
        {groups.map(letter => {
          const teams = byGroup[letter];
          const status = groupStatus(teams);
          return (
            <div key={letter} className="gcard">
              <div className="gcard-label mono">
                GROUP {letter}{status ? ` — ${status}` : ''}
              </div>
              {teams.map(p => {
                const state = rowState(p);
                return (
                  <div key={p.id} className={`gcard-row row-${state}`}>
                    <span className="gcard-flag">{p.flag}</span>
                    <span className="gcard-team">{p.team}</span>
                    <span className="gcard-owner">{p.name}</span>
                    {isLive && <span className="gcard-dot">{DOT[state]}</span>}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </section>
  );
}

Object.assign(window, { Countdown, PreHero, DrawList, PreDrawer, PrizeRules, PrizeRuleCard, GroupsSection });
</script>
  <script type="text/babel">// ── components-table.jsx — filters, participants table, detail drawer ────────

const STATUS_META = {
  active:     { label: 'Still in', cls: 'st-active' },
  eliminated: { label: 'Knocked out', cls: 'st-out' },
  spoon:      { label: 'Wooden Spoon', cls: 'st-spoon' },
};

const PRIZE_LABEL = {
  winner: 'Winner · £96', runner: 'Runner-Up · £60', boot: 'Golden Boot · £48',
  goals: 'Most Goals · £24', spoon: 'Wooden Spoon · £12',
};

function Filters({ filter, setFilter, counts, query, setQuery }) {
  const tabs = [
    ['all', 'All', counts.all],
    ['active', 'Still in', counts.active],
    ['eliminated', 'Knocked out', counts.eliminated],
    ['prize', 'In the money', counts.prize],
  ];
  return (
    <div className="filters">
      <div className="ftabs">
        {tabs.map(([k, label, n]) => (
          <button key={k} className={'ftab' + (filter === k ? ' is-on' : '')}
                  onClick={() => setFilter(k)}>
            {label}<span className="ftab-n mono">{n}</span>
          </button>
        ))}
      </div>
      <div className="fsearch">
        <input className="fsearch-in" placeholder="Search team or entrant…"
               value={query} onChange={(e) => setQuery(e.target.value)} />
        {query && <button className="fsearch-x" onClick={() => setQuery('')}>✕</button>}
      </div>
    </div>
  );
}

function StatusBadge({ status }) {
  const m = STATUS_META[status];
  return <span className={'sbadge ' + m.cls}><i className="sdot" />{m.label}</span>;
}

function ParticipantTable({ rows, sort, setSort, onPick, topGoals }) {
  const head = [
    ['id', '#'], ['name', 'Entrant'], ['team', 'Team'],
    ['goals', 'Goals'], ['status', 'Status'], ['prize', 'Prize'],
  ];
  const arrow = (k) => sort.key === k ? (sort.dir === 1 ? '▲' : '▼') : '';
  return (
    <div className="tablewrap">
      <table className="ptable">
        <thead>
          <tr>
            {head.map(([k, label]) => (
              <th key={k} className={'col-' + k + (sort.key === k ? ' is-sorted' : '')}
                  onClick={() => setSort(k)}>
                <span>{label}</span><span className="th-arrow mono">{arrow(k)}</span>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map((p) => (
            <tr key={p.id} className={'prow prow--' + p.status} onClick={() => onPick(p)}>
              <td className="col-id mono">{String(p.id).padStart(2, '0')}</td>
              <td className="col-name">{p.name}</td>
              <td className="col-team">
                <span className={'ttag ttag--' + p.status}>
                  <span className="tflag">{p.flag}</span>{p.team}
                </span>
              </td>
              <td className="col-goals">
                <span className={'gbadge mono' + (p.goals === topGoals ? ' is-top' : '')}>
                  {p.goals}
                </span>
              </td>
              <td className="col-status"><StatusBadge status={p.status} /></td>
              <td className="col-prize">
                {p.prizeKey
                  ? <span className={'ptag ptag--' + p.prizeKey + (p.status==='spoon'||p.prizeKey==='goals'?' is-won':'')}>{PRIZE_LABEL[p.prizeKey]}</span>
                  : <span className="ptag-none mono">—</span>}
              </td>
            </tr>
          ))}
          {rows.length === 0 && (
            <tr><td colSpan="6" className="empty mono">No entrants match that.</td></tr>
          )}
        </tbody>
      </table>
    </div>
  );
}

// Build a plausible "run" timeline for the detail drawer from the seed data.
function buildRun(p) {
  const steps = [
    { stage: 'Draw', text: `Drew ${p.team}`, state: 'done' },
  ];
  if (p.status === 'active') {
    steps.push({ stage: 'Group ' + p.group, text: `Group stage underway · ${p.goals} goal${p.goals === 1 ? '' : 's'} scored`, state: 'current' });
    steps.push({ stage: 'Round of 16', text: 'Locked', state: 'todo' });
    steps.push({ stage: 'Quarter-Finals', text: 'Locked', state: 'todo' });
  } else if (p.status === 'through') {
    steps.push({ stage: 'Group ' + p.group, text: `Finished ${p.finish} · ${p.goals} goal${p.goals === 1 ? '' : 's'} scored`, state: 'done' });
    steps.push({ stage: 'Round of 16', text: 'In the hat — fixture to come', state: 'current' });
    steps.push({ stage: 'Quarter-Finals', text: 'Locked', state: 'todo' });
  } else if (p.status === 'spoon') {
    steps.push({ stage: 'Group ' + p.group, text: `Finished ${p.finish} · ${p.goals} goal${p.goals === 1 ? '' : 's'} scored`, state: 'done' });
    steps.push({ stage: 'Knocked out', text: 'Bottom of the group — Wooden Spoon', state: 'out' });
  } else {
    steps.push({ stage: 'Group ' + p.group, text: `Finished ${p.finish} · ${p.goals} goal${p.goals === 1 ? '' : 's'} scored`, state: 'done' });
    steps.push({ stage: 'Knocked out', text: `${p.finish} in Group ${p.group} — didn't advance`, state: 'out' });
  }
  return steps;
}

function DetailDrawer({ p, open, onClose, topGoals }) {
  if (!p) return null;
  const run = buildRun(p);
  const inMoney = !!p.prizeKey;
  return (
    <div className={'drawer-scrim' + (open ? ' is-open' : '')} onClick={onClose}>
      <aside className={'drawer' + (open ? ' is-open' : '')} onClick={(e) => e.stopPropagation()}>
        <button className="drawer-x" onClick={onClose} aria-label="Close">✕</button>
        <div className="drawer-hd">
          <div className="drawer-num mono">ENTRANT {String(p.id).padStart(2, '0')} / 48</div>
          <h3 className="drawer-name disp">{p.name}</h3>
          <div className="drawer-team">
            <span className="drawer-flag">{p.flag}</span>
            <span className="drawer-teamname disp">{p.team}</span>
          </div>
          <StatusBadge status={p.status} />
        </div>

        <div className="drawer-stats">
          <div className="dstat"><span className="dstat-n disp">{p.goals}</span><span className="dstat-l mono">GROUP GOALS</span></div>
          <div className="dstat"><span className="dstat-n disp">{p.group}</span><span className="dstat-l mono">GROUP</span></div>
          <div className="dstat"><span className="dstat-n disp">{p.finish}</span><span className="dstat-l mono">FINISH</span></div>
          <div className="dstat"><span className="dstat-n disp">£{p.stake}</span><span className="dstat-l mono">STAKE</span></div>
        </div>

        {inMoney && (
          <div className={'drawer-prize ptag--' + p.prizeKey}>
            <span className="mono">IN THE MONEY</span>
            <strong>{PRIZE_LABEL[p.prizeKey]}</strong>
          </div>
        )}

        <div className="drawer-run">
          <div className="drun-head mono">THE RUN</div>
          {run.map((s, i) => (
            <div key={i} className={'drun-step drun-' + s.state}>
              <span className="drun-dot" />
              <div className="drun-body">
                <div className="drun-stage">{s.stage}</div>
                <div className="drun-text mono">{s.text}</div>
              </div>
            </div>
          ))}
        </div>
      </aside>
    </div>
  );
}

Object.assign(window, {
  Filters, ParticipantTable, DetailDrawer, StatusBadge, buildRun,
  STATUS_META, PRIZE_LABEL,
});
</script>
  <script type="text/babel">// ── app.jsx — The Sweep '26 ──────────────────────────────────────────────────

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "title": "THE SWEEP",
  "theme": "modernist",
  "appearance": "light",
  "displayFont": "Big Shoulders Display",
  "density": "regular",
  "stage": "auto",
  "halftone": true,
  "confetti": true,
  "welcomeTag": "YOU'RE IN",
  "welcomeText": "The draw is done. The teams are set. Somewhere in this list is the person who's walking away with £96. Is it you? Probably not. But maybe. 👀"
}/*EDITMODE-END*/;

const THEME_OPTS = [
  { value: 'hosts',     label: 'Hosts (USA · CAN · MEX)' },
  { value: 'panini',    label: 'Panini (Mexico ’70)' },
  { value: 'modernist', label: 'Modernist (España ’82)' },
  { value: 'night',     label: 'Floodlit (night)' },
];
const FONT_OPTS = [
  { value: 'Big Shoulders Display', label: 'Big Shoulders (athletic)' },
  { value: 'Anton', label: 'Anton (poster)' },
  { value: 'Archivo Black', label: 'Archivo Black (bold)' },
  { value: 'Oswald', label: 'Oswald (condensed)' },
];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [D, setD] = React.useState(window.SWEEP);
  const [apiStatus, setApiStatus] = React.useState('loading'); // 'loading' | 'ok' | 'error'
  const [apiError, setApiError] = React.useState(null);

  React.useEffect(() => {
    if (typeof SWEEP_API === 'undefined') { setApiStatus('error'); setApiError('SWEEP_API not defined'); return; }
    let alive = true;
    const load = () => {
      SWEEP_API.fetchSweep()
        .then(data => { if (alive) { setD(data); setApiStatus('ok'); setApiError(null); } })
        .catch(err => { if (alive) { setApiStatus('error'); setApiError(err?.message || String(err)); } });
    };
    load();
    const id = setInterval(load, 60000);
    return () => { alive = false; clearInterval(id); };
  }, []);

  // Pre-kickoff vs live: auto by date, overridable in Tweaks.
  const [nowTs, setNowTs] = React.useState(() => Date.now());
  React.useEffect(() => {
    const id = setInterval(() => setNowTs(Date.now()), 30000);
    return () => clearInterval(id);
  }, []);
  const kickTs = React.useMemo(() => new Date(D.KICKOFF).getTime(), [D]);
  const phase = t.stage === 'pre' ? 'pre'
              : t.stage === 'live' ? 'live'
              : (nowTs < kickTs ? 'pre' : 'live');

  const [filter, setFilter] = React.useState('all');
  const [query, setQuery] = React.useState('');
  const [sort, setSortState] = React.useState({ key: 'id', dir: 1 });
  const [picked, setPicked] = React.useState(null);
  const [drawerOpen, setDrawerOpen] = React.useState(false);
  const [trackIn, setTrackIn] = React.useState(false);

  // apply theme/appearance/font to <html>
  React.useEffect(() => {
    const r = document.documentElement;
    r.setAttribute('data-theme', t.theme);
    r.setAttribute('data-appearance', t.appearance);
    r.style.setProperty('--font-display', `'${t.displayFont}', sans-serif`);
    r.setAttribute('data-density', t.density);
    r.style.setProperty('--halftone-on', t.halftone ? '1' : '0');
    document.body.style.setProperty('--ht-opacity', t.halftone ? '.9' : '0');
  }, [t.theme, t.appearance, t.displayFont, t.density, t.halftone]);

  // animate the tracker in once on mount
  React.useEffect(() => {
    const id = setTimeout(() => setTrackIn(true), 250);
    return () => clearTimeout(id);
  }, []);

  const topGoals = React.useMemo(
    () => Math.max(...D.participants.map(p => p.goals)), [D]);

  // Pre-kickoff: nothing's played yet — group stage is "up next", rest upcoming.
  const preStages = React.useMemo(
    () => D.STAGES.map((s, i) => ({ ...s, state: i === 0 ? 'next' : 'todo' })), [D]);

  const counts = React.useMemo(() => ({
    all: D.participants.length,
    active: D.participants.filter(p => p.status === 'active').length,
    eliminated: D.participants.filter(p => p.status !== 'active').length,
    prize: D.participants.filter(p => p.prizeKey).length,
  }), [D]);

  const rows = React.useMemo(() => {
    let r = D.participants.slice();
    if (filter === 'active') r = r.filter(p => p.status === 'active');
    else if (filter === 'eliminated') r = r.filter(p => p.status !== 'active');
    else if (filter === 'prize') r = r.filter(p => p.prizeKey);
    const q = query.trim().toLowerCase();
    if (q) r = r.filter(p => p.team.toLowerCase().includes(q) || p.name.toLowerCase().includes(q));
    const dir = sort.dir;
    r.sort((a, b) => {
      let av, bv;
      switch (sort.key) {
        case 'name': av = a.id; bv = b.id; break;
        case 'team': av = a.team; bv = b.team; break;
        case 'goals': av = a.goals; bv = b.goals; break;
        case 'status': av = a.status; bv = b.status; break;
        case 'prize': av = a.prizeKey || 'zzz'; bv = b.prizeKey || 'zzz'; break;
        default: av = a.id; bv = b.id;
      }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return a.id - b.id;
    });
    return r;
  }, [D, filter, query, sort]);

  const setSort = (key) => {
    setSortState(s => s.key === key ? { key, dir: -s.dir } : { key, dir: key === 'goals' ? -1 : 1 });
  };

  const wonKeys = React.useMemo(() => D.PRIZES.filter(p => p.won).map(p => p.key), [D]);

  const pick = (p) => {
    setPicked(p);
    requestAnimationFrame(() => setDrawerOpen(true));
    // Celebrate locked-in prize holders as their drawer slides in (live only).
    if (phase === 'live' && t.confetti && p.prizeKey && wonKeys.includes(p.prizeKey)) {
      setTimeout(() => {
        const x = window.innerWidth - Math.min(220, window.innerWidth * 0.46);
        window.fireConfetti({ x, y: window.innerHeight * 0.32, count: 130 });
      }, 340);
    }
  };
  const closeDrawer = () => { setDrawerOpen(false); setTimeout(() => setPicked(null), 280); };

  // Tapping a prize card opens that prize leader's detail drawer.
  const openPrizeLeader = (prize) => {
    const person = D.participants.find(p => p.name === prize.leader);
    if (person) pick(person);
  };

  // one-off pot celebration on first view
  React.useEffect(() => {
    if (!t.confetti) return;
    const seen = sessionStorage.getItem('sweep-welcomed');
    if (seen) return;
    sessionStorage.setItem('sweep-welcomed', '1');
    const id = setTimeout(() => window.fireConfetti({ count: 110 }), 700);
    return () => clearTimeout(id);
  }, []);

  return (
    <div className="app" data-phase={phase}>
      <Masthead title={t.title}
                sub={phase === 'pre'
                  ? '48 ENTRANTS · £5 A TEAM · KICK-OFF 11 JUNE'
                  : '48 ENTRANTS · £5 A TEAM · ROUND OF 16'} />

      {phase === 'pre' ? (
        <React.Fragment>
        <PreHero kickoff={D.KICKOFF} pot={D.POT}
                 welcomeTag={t.welcomeTag} welcomeText={t.welcomeText} />
          <GroupsSection participants={D.participants} phase={phase} />
          <PrizeRules prizes={D.PRIZES} />
          <DrawList participants={D.participants} onPick={pick} />
          <StageTracker stages={preStages} animate={trackIn} n="04"
                        sub="64 matches · the road from groups to glory" />
        </React.Fragment>
      ) : (
        <React.Fragment>
          <div className="wrap hero">
            <Pot pot={D.POT} />
            <StoryTicker participants={D.participants} prizes={D.PRIZES} />
          </div>

          <PrizeBoard prizes={D.PRIZES} onCelebrate={openPrizeLeader} />

          <GroupsSection participants={D.participants} phase={phase} />

          <StageTracker stages={D.STAGES} animate={trackIn} />

          <section className="wrap people-sec">
            <SectionHead n="03" title="All 48 entrants" sub="Tap a row to see their run" />
            <Filters filter={filter} setFilter={setFilter} counts={counts}
                     query={query} setQuery={setQuery} />
            <ParticipantTable rows={rows} sort={sort} setSort={setSort}
                              onPick={pick} topGoals={topGoals} />
          </section>
        </React.Fragment>
      )}


      {phase === 'live' &&
        <DetailDrawer p={picked} open={drawerOpen} onClose={closeDrawer} topGoals={topGoals} />}
      {phase === 'pre' &&
        <PreDrawer p={picked} open={drawerOpen} onClose={closeDrawer} participants={D.participants} />}

      <TweaksPanel title="Tweaks">
        <TweakSection label="Direction" />
        <TweakRadio label="Theme" value={t.theme} options={THEME_OPTS}
                    onChange={(v) => setTweak('theme', v)} />
        <TweakSection label="Type" />
        <TweakSelect label="Display font" value={t.displayFont} options={FONT_OPTS}
                     onChange={(v) => setTweak('displayFont', v)} />
        <TweakSection label="Layout" />
        <TweakRadio label="Stage" value={t.stage}
                    options={[{value:'auto',label:'Auto'},{value:'pre',label:'Pre-kick'},{value:'live',label:'Live'}]}
                    onChange={(v) => setTweak('stage', v)} />
        <TweakRadio label="Density" value={t.density}
                    options={['compact','regular','comfy']}
                    onChange={(v) => setTweak('density', v)} />
        <TweakToggle label="Halftone texture" value={t.halftone}
                     onChange={(v) => setTweak('halftone', v)} />
        <TweakToggle label="Confetti" value={t.confetti}
                     onChange={(v) => setTweak('confetti', v)} />
        <TweakSection label="Title" />
        <TweakText label="Masthead" value={t.title}
                   onChange={(v) => setTweak('title', v)} />
        <TweakSection label="Pre-kickoff banner" />
        <TweakText label="Banner tag" value={t.welcomeTag}
                   onChange={(v) => setTweak('welcomeTag', v)} />
        <TweakText label="Welcome message" value={t.welcomeText} multiline
                   onChange={(v) => setTweak('welcomeText', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
